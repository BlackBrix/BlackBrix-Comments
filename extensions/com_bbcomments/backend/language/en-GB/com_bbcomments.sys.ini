COM_BBCOMMENTS="BlackBrix Comments"
COM_BBCOMMENTS_XML_DESCRIPTION="Comments for Joomla!™ articles made easy"

COM_BBCOMMENTS_CONFIGURATION="BlackBrix Comments <small>Site-level Configuration</small>"

; Permissions
COM_BBCOMMENTS_CONFIG_ACL_CREATE="Comment"
COM_BBCOMMENTS_CONFIG_ACL_CREATE_DESC="Allows users in the group to post comments"
COM_BBCOMMENTS_CONFIG_ACL_DELETE_DESC="Allows users in the group to permanently delete comments"
COM_BBCOMMENTS_CONFIG_ACL_EDIT_DESC="Allows users in the group to edit any comment, if it's not theirs"
COM_BBCOMMENTS_CONFIG_ACL_EDIT_OWN_DESC="Allows users in the group to edit their own comments"
COM_BBCOMMENTS_CONFIG_ACL_EDIT_STATE_DESC="Allows users in the group to publish and unpublish comments"

; Configuration -- Basic
COM_BBCOMMENTS_CONFIG_BASIC_FIELDSET_LABEL="Basic"
COM_BBCOMMENTS_CONFIG_BASIC_FIELDSET_DESC="Basic configuration about how comments work"

COM_BBCOMMENTS_CONFIG_MAX_LEVEL_LABEL="Maximum comment nesting"
COM_BBCOMMENTS_CONFIG_MAX_LEVEL_DESC="<p>Maximum number of nested comment levels. For example, 3 means a top-level comment, a reply to it, and a reply to that reply. The default is 3. Choose 1 to disallow nested replies.</p><p>This setting only affects new replies; existing comment threads are not changed. It cannot be overridden for specific categories or articles.</p>"

COM_BBCOMMENTS_DEFAULT_PUBLISH_LABEL="New comments"
COM_BBCOMMENTS_DEFAULT_PUBLISH_DESC="<p>Should newly posted comments be published or unpublished by default? In the latter case a comment administrator needs to manually publish them.</p><p><strong>IMPORTANT!</strong> This option does NOT apply to comments published by comment administrators. These comments are always published immediately. It would be nonsensical asking the user posting such a comment to moderate their own comment.</p>"

COM_BBCOMMENTS_DEFAULT_LIMIT_LABEL="Number of comments per page"
COM_BBCOMMENTS_DEFAULT_LIMIT_DESC="<p>Choose how many comments to display at once. “Use Global” uses Joomla’s global list limit.</p><p>Large values such as 500 or All can cause slow pages or timeouts on articles with many comments. Consider using 20 or 50.</p>"

COM_BBCOMMENTS_CONFIG_CAPTCHA_LABEL="CAPTCHA for comments"
COM_BBCOMMENTS_CONFIG_CAPTCHA_DESC="<p>Select the CAPTCHA plugin that will be used in the comments form. You may need to enter required information for your CAPTCHA plugin in the Plugin Manager.</p><p>If “Use Global” is selected, make sure a CAPTCHA plugin is selected in Joomla's Global Configuration.</p><p>This setting CAN NOT be overriden for specific categories or articles.</p>"

COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_LABEL="Use CAPTCHA for these users"
COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_DESC="<p>Which users posting a comment should be shown the CAPTCHA defined above? We recommend using Guests</p><p>“<strong>Guests</strong>” will only show the CAPTCHA to guest (not logged in) users.</p><p>“<strong>Anyone but comment administrators</strong>” will show the CAPTCHA to guests, as well as logged users for whom the “Configure” privilege is not enabled.</p><p>“<strong>All</strong>” will show the CAPTCHA to everyone posting a comment.</p>"
COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_GUESTS="Guests"
COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_NONMANAGER="Anyone but comment administrators"
COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_ALL="All"

COM_BBCOMMENTS_CONFIG_TOS_ACCEPT_LABEL="Require guest consent to terms"
COM_BBCOMMENTS_CONFIG_TOS_ACCEPT_DESC="<p>When enabled, guests must accept your terms and/or privacy notice before submitting a comment.</p><p>The checkbox label can be configured in the next option. Its error message can be customised using the frontend language key <code>COM_BBCOMMENTS_COMMENTS_ERR_TOSACCEPT</code>.</p>"

COM_BBCOMMENTS_CONFIG_TOS_PROMPT_LABEL="Consent checkbox text"
COM_BBCOMMENTS_CONFIG_TOS_PROMPT_DESC="<p>Text displayed next to the checkbox guests must select before submitting a comment.</p><p>If empty, the default text from <code>COM_BBCOMMENTS_COMMENTS_FORM_LBL_ACCEPT</code> is used.</p>"

COM_BBCOMMENTS_CONFIG_HEADER_OVERRIDABLE_HEADER="Default comment parameters"
COM_BBCOMMENTS_CONFIG_HEADER_OVERRIDABLE_DESC="The following parameters can be overridden in each article or article category."

COM_BBCOMMENTS_COMMENTS_SHOW_LABEL="Comments interface"
COM_BBCOMMENTS_COMMENTS_SHOW_DESC="Should I display the comments interface? Choosing Hide will hide all existing comments and disable new comments. This setting can be overridden in specific categories and / or articles."

COM_BBCOMMENTS_COMMENTS_SHOW_FEATURE_LABEL="Comment summary on Featured Articles"
COM_BBCOMMENTS_COMMENTS_SHOW_FEATURE_DESC="Show the number of published comments for each article in Joomla’s Featured Articles view (commonly used on the home page)?"

COM_BBCOMMENTS_COMMENTS_SHOW_CATEGORY_LABEL="Comment summary in Blog views"
COM_BBCOMMENTS_COMMENTS_SHOW_CATEGORY_DESC="Show the number of published comments for each article in Joomla’s Blog views?"

COM_BBCOMMENTS_COMMENTS_SHOW_ARTICLE_LABEL="Comment summary in the Newsflash module"
COM_BBCOMMENTS_COMMENTS_SHOW_ARTICLE_DESC="Show the number of published comments for each article displayed by Joomla’s Newsflash module?"

COM_BBCOMMENTS_OPT_COMMENTS_SHOW_BEFORE="Before content"
COM_BBCOMMENTS_OPT_COMMENTS_SHOW_AFTER="After content"

COM_BBCOMMENTS_COMMENTS_ENABLED_LABEL="Allow new comments"
COM_BBCOMMENTS_COMMENTS_ENABLED_DESC="Allow visitors to submit new comments? Choosing No keeps existing comments visible but prevents new submissions. This can be overridden for individual categories or articles."

COM_BBCOMMENTS_COMMENTS_REPLY_BAD_UX_LABEL="Hide the comment entry form by default"
COM_BBCOMMENTS_COMMENTS_REPLY_BAD_UX_DESC="Hide the comment entry form by default? Instead of the form, a “Leave a comment” button is shown. Clicking this button (or the Reply button on any comment) hides the button and displays the comment entry form."

COM_BBCOMMENTS_COMMENTS_PLEASEWAIT_LABEL="Show “Please wait” when submitting"
COM_BBCOMMENTS_COMMENTS_PLEASEWAIT_DESC="When enabled, the submit button is disabled after it is clicked and displays “Please wait”. This helps prevent accidental duplicate submissions. JavaScript is required."

COM_BBCOMMENTS_COMMENTS_MIN_LENGTH_LABEL="Minimum comment length"
COM_BBCOMMENTS_COMMENTS_MIN_LENGTH_DESC="The minimum permissible length (in bytes) of a comment's HTML. Use 0 to not apply a limit."

COM_BBCOMMENTS_COMMENTS_MAX_LENGTH_LABEL="Maximum comment length"
COM_BBCOMMENTS_COMMENTS_MAX_LENGTH_DESC="The maximum permissionble length (in bytes) of a comment's HTML. Use 0 to not apply a limit. When this is non-zero it must be higher than “Minimum content length”, otherwise this setting is <em>ignored</em>."

COM_BBCOMMENTS_COMMENTS_ORDERING_LABEL="Comments ordering"
COM_BBCOMMENTS_COMMENTS_ORDERING_DESC="Display order of the comments, by date. Ascending shows oldest comments first. Descending shows newest comments first."

COM_BBCOMMENTS_COMMENTS_CLOSE_AFTER_LABEL="Close comments after this many days"
COM_BBCOMMENTS_COMMENTS_CLOSE_AFTER_DESC="Comments will be closed automatically after this many days since the article was published. 0 is a special value and it means that the comments will never be closed automatically. This setting can be overridden in specific categories and / or articles."

COM_BBCOMMENTS_COMMENTS_NOTIFY_AUTHOR_LABEL="Notify author"
COM_BBCOMMENTS_COMMENTS_NOTIFY_AUTHOR_DESC="Notify the article author once a new comment becomes published. Comments requiring moderation trigger this notification only after approval."

COM_BBCOMMENTS_COMMENTS_NOTIFY_USERS_LABEL="Notify users"
COM_BBCOMMENTS_COMMENTS_NOTIFY_USERS_DESC="Should I notify (send emails) to the users when a reply is sent to a comment they posted on the content?"

; Configuration -- Text Filtering
COM_BBCOMMENTS_CONFIG_FILTERING_FIELDSET_LABEL="Text Filtering"
COM_BBCOMMENTS_CONFIG_FILTERING_FIELDSET_DESC="Configures the filtering of the comments' HTML. <strong>WARNING!</strong> Modifying these options affects the security of your site. You are strongly advised to use the default options unless you are confident in your understanding of the security repercussions."

COM_BBCOMMENTS_CONFIG_FILTER_MODE_LABEL="Filter Mode"
COM_BBCOMMENTS_CONFIG_FILTER_MODE_DESC="<p>BlackBrix Comments offers three modes for filtering the HTML content of comments to make them safe:</p><ul><li><strong>Joomla Text Filters</strong>. This uses Joomla's Text Filters options, defined in Global Configuration, using Joomla's own HTML filtering code.</li><li><strong>HTML Purifier</strong>. This uses the more robust HTML Purifier library. When a user group is set up to use No HTML filtering it falls back to Joomla's code that strips all HTML tags.</li><li><strong>HTML Purifier (allow minimal HTML)</strong>. Like the option above, but when a user group is set up to use No HTML filtering we actually allow a <em>very</em> small subset of safe HTML tags. Recommended so that Guest users will be able to post formatted comments without risking your site's security.</li></ul>"
COM_BBCOMMENTS_CONFIG_FILTER_MODE_JOOMLA="Joomla Text Filters"
COM_BBCOMMENTS_CONFIG_FILTER_MODE_HTMLPURIFIER="HTML Purifier"
COM_BBCOMMENTS_CONFIG_FILTER_MODE_STRICT="HTML Purifier (allow minimal HTML)"

COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_CONFIG_JOOMLA_LABEL="HTML Purifier uses Joomla Text Filters configuration"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_CONFIG_JOOMLA_DESC="<p>Only applicable if the Filter Mode is set to “HTML Purifier (with Joomla fallback)“ or “HTML Purifier only“.</p><p>When enabled HTML Purifier will use the tag and attributes blacklist and whitelist defined in Joomla's Text Filters tab in the Global Configuration page. This allows you to have a different HTML filtering level per user group but it can be unsafe under some circumstances.</p><p>When disabled HTML Purifier will use the “HTML Purifier whitelist“ option below for <strong>all users</strong>. This is the safest approach but prevents you from using advanced tags, embedding videos etc even if you are a Super user!</p>"

COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_CONFIGSTRING_LABEL="HTML Purifier whitelist"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_CONFIGSTRING_DESC="<p>Only applicable when both a. the Filter Mode is set to “HTML Purifier (with Joomla fallback)“ or “HTML Purifier only“ and b. “HTML Purifier uses Joomla Text Filters configuration“ is set to No.</p><p>This option tells HTML Purifier which tags and which attributes are allowed. Anything not explicitly defined here will be rejected.</p><p>This is a comma separated string of elements defined as <code>tag</code> (tag allowed but without attributes) or <code>tag[attribute]</code> (attribute allowed for tag). Settings are cumulative.</p>"

; Configuration -- Advanced
COM_BBCOMMENTS_CONFIG_ADVANCED_FIELDSET_LABEL="Advanced"
COM_BBCOMMENTS_CONFIG_ADVANCED_FIELDSET_DESC="Configuration options for expert users"



COM_BBCOMMENTS_CONFIG_IPLOOKUP_LABEL="IP Lookup Service"
COM_BBCOMMENTS_CONFIG_IPLOOKUP_DESC="<p>Enter a URL for an IP lookup service. This is used whenever BlackBrix Comments displays IP addresses to comment administrators and content editors.</p><p>Use the format <code>https://www.example.com/something/%s</code>, i.e. replace the IP displayed in the lookup service's URL with <code>%s</code>.</p><p>A default value has been provided for your convenience. This third party service is NOT affiliated with or supported by BlackBrix in any way.</p>"

COM_BBCOMMENTS_CONFIG_MAX_SPAM_AGE_LABEL="Delete spam older than this many days"
COM_BBCOMMENTS_CONFIG_MAX_SPAM_AGE_DESC="<p>Comments marked as spam and older than this many days are cleaned up automatically. The content plugin checks no more than once every eight hours, provided it runs and the website receives traffic.</p><p>Set 0 to disable automatic spam cleanup. The removed Console plugin is not required.</p>"


COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_LABEL="HTML Purifier inclusion"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_DESC="<p>Choose how BlackBrix Comments will include the HTML Purifier library. If you are unsure choose “Composer“</p><ul><li><strong>Composer</strong> Uses the Composer autoloader. Default and recommended.</li><li><strong>Autoloader</strong> Uses HTML Purifier's autoloader. Functionally equivalent to “Composer“ but it doesn't load Composer itself since it's not used by HTML Purifier anyway.</li><li><strong>All at once</strong> This loads all HTML Purifier classes in memory at once. It provides better performance if your site is using PHP's OPcode cache.</li></ul>"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_COMPOSER="Composer"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_AUTO="Autoloader"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_ALL="All at once"

COM_BBCOMMENTS_CONFIG_LOADCUSTOMCSS_LABEL="Load custom CSS"
COM_BBCOMMENTS_CONFIG_LOADCUSTOMCSS_DESC="Only use for sites which DO NOT use Bootstrap 5 in the frontend template. Loads a custom CSS file (media/com_bbcomments/css/comments.css or its media override) in the frontend pages."
COM_BBCOMMENTS_CONTEXT_LABEL="Usage (default)"
COM_BBCOMMENTS_CONTEXT_DESC="Article comments by default. Categories and articles can override this setting."
COM_BBCOMMENTS_CONTEXT_COMMENT="Article comments"
COM_BBCOMMENTS_CONTEXT_GUESTBOOK="Guestbook"

COM_BBCOMMENTS_GUESTBOOK_BUTTON_LABEL="Show guestbook button automatically"
COM_BBCOMMENTS_GUESTBOOK_BUTTON_DESC="When enabled, automatically display a Write an entry button after the text of guestbook articles and before the entries. Existing manual guestbook links are not duplicated. Default: No."
