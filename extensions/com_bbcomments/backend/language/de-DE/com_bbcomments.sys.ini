COM_BBCOMMENTS="BlackBrix Comments"
COM_BBCOMMENTS_XML_DESCRIPTION="Kommentare für Joomla!™ Artikel leicht gemacht"

COM_BBCOMMENTS_CONFIGURATION="BlackBrix Comments <small>Site-Level Konfiguration</small>"

; Permissions
COM_BBCOMMENTS_CONFIG_ACL_CREATE="Kommentare"
COM_BBCOMMENTS_CONFIG_ACL_CREATE_DESC="Ermöglicht Benutzern in der Gruppe, Kommentare zu veröffentlichen"
COM_BBCOMMENTS_CONFIG_ACL_DELETE_DESC="Ermöglicht Benutzern in der Gruppe, Kommentare dauerhaft zu löschen"
COM_BBCOMMENTS_CONFIG_ACL_EDIT_DESC="Ermöglicht Benutzern in der Gruppe, Kommentare zu bearbeiten, sofern diese nicht von ihnen stammen"
COM_BBCOMMENTS_CONFIG_ACL_EDIT_OWN_DESC="Ermöglicht Benutzern in der Gruppe, ihre eigenen Kommentare zu bearbeiten"
COM_BBCOMMENTS_CONFIG_ACL_EDIT_STATE_DESC="Ermöglicht Benutzern in der Gruppe das Veröffentlichen und Aufheben der Veröffentlichung von Kommentaren"

; Configuration -- Basic
COM_BBCOMMENTS_CONFIG_BASIC_FIELDSET_LABEL="Grundkonfiguration"
COM_BBCOMMENTS_CONFIG_BASIC_FIELDSET_DESC="Grundkonfiguration zur Funktionsweise von Kommentaren"

COM_BBCOMMENTS_CONFIG_MAX_LEVEL_LABEL="Maximale Verschachtelung von Kommentaren"
COM_BBCOMMENTS_CONFIG_MAX_LEVEL_DESC="<p>Legt fest, wie viele Ebenen von Antworten erlaubt sind. Bei 3 Ebenen sind das ein Hauptkommentar, eine Antwort und eine Antwort auf diese Antwort. Der Standardwert ist 3. Mit 1 werden Antworten auf Kommentare unterbunden.</p><p>Die Einstellung gilt nur für neue Antworten und ändert vorhandene Kommentarverläufe nicht rückwirkend. Sie kann nicht für einzelne Kategorien oder Beiträge überschrieben werden.</p>"

COM_BBCOMMENTS_DEFAULT_PUBLISH_LABEL="Neue Kommentare"
COM_BBCOMMENTS_DEFAULT_PUBLISH_DESC="<p>Sollen neu veröffentlichte Kommentare standardmäßig veröffentlicht oder nicht veröffentlicht werden? Im letzteren Fall muss ein Kommentaradministrator sie manuell veröffentlichen.</p><p><strong>WICHTIG!</strong> Diese Option gilt NICHT für Kommentare, die von Kommentaradministratoren veröffentlicht wurden. Diese Kommentare werden immer sofort veröffentlicht. Es wäre unsinnig, den Benutzer, der einen solchen Kommentar veröffentlicht, zu bitten, seinen eigenen Kommentar zu moderieren.</p>"

COM_BBCOMMENTS_DEFAULT_LIMIT_LABEL="Anzahl der Kommentare pro Seite"
COM_BBCOMMENTS_DEFAULT_LIMIT_DESC="<p>Legt fest, wie viele Kommentare gleichzeitig angezeigt werden. Mit „Global verwenden“ gilt die Joomla-weite Einstellung für die Listenlänge.</p><p>Sehr hohe Werte (z. B. 500 oder Alle) können bei vielen Kommentaren zu langen Ladezeiten oder Zeitüberschreitungen führen. Meist sind 20 oder 50 sinnvoll.</p>"

COM_BBCOMMENTS_CONFIG_CAPTCHA_LABEL="CAPTCHA für Kommentare"
COM_BBCOMMENTS_CONFIG_CAPTCHA_DESC="<p>Das CAPTCHA-Plugin auswählen, das im Kommentarformular verwendet werden soll. Möglicherweise müssen die erforderlichen Informationen für das CAPTCHA-Plugin im Plugin-Manager eingeben werden.</p><p>Wenn “Global benutzen” ausgewählt ist, muss sichergestellt sein, dass in der globalen Konfiguration von Joomla ein CAPTCHA-Plugin ausgewählt ist.</p><p>Diese Einstellung kann für bestimmte Kategorien oder Artikel NICHT überschrieben werden.</p>"

COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_LABEL="CAPTCHA für diese Benutzer verwenden"
COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_DESC="<p>Welchen Benutzern, die einen Kommentar veröffentlichen, sollte das oben definierte CAPTCHA angezeigt werden? Es wird die Verwendung bei Gästen empfohlen</p><p>“<strong>Gäste</strong>” zeigt das CAPTCHA nur Gästen (nicht angemeldet) an.</p><p>“<strong>Alle außer Kommentaradministratoren</strong>” zeigt das CAPTCHA Gästen sowie protokollierten Benutzern an, für die die Berechtigung “Konfigurieren” nicht aktiviert ist.</p><p>“<strong>Alle</strong>” zeigt das CAPTCHA allen, die einen Kommentar veröffentlichen.</p>"
COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_GUESTS="Gäste"
COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_NONMANAGER="Alle außer Kommentaradministratoren"
COM_BBCOMMENTS_CONFIG_CAPTCHA_FOR_ALL="Alle"

COM_BBCOMMENTS_CONFIG_TOS_ACCEPT_LABEL="Zustimmung zu Bedingungen für Gäste"
COM_BBCOMMENTS_CONFIG_TOS_ACCEPT_DESC="<p>Wenn diese Option aktiviert ist, müssen Gäste den Nutzungsbedingungen beziehungsweise Datenschutzhinweisen zustimmen, bevor sie einen Kommentar absenden können.</p><p>Den Text des Kontrollkästchens kannst du in der nächsten Option ändern. Die Fehlermeldung lässt sich über die Frontend-Sprachkonstante <code>COM_BBCOMMENTS_COMMENTS_ERR_TOSACCEPT</code> anpassen.</p>"

COM_BBCOMMENTS_CONFIG_TOS_PROMPT_LABEL="Text des Zustimmungs-Kontrollkästchens"
COM_BBCOMMENTS_CONFIG_TOS_PROMPT_DESC="<p>Text, der neben dem Kontrollkästchen angezeigt wird, das Gäste vor dem Absenden eines Kommentars aktivieren müssen.</p><p>Bleibt das Feld leer, wird der Standardtext aus der Sprachkonstante <code>COM_BBCOMMENTS_COMMENTS_FORM_LBL_ACCEPT</code> verwendet.</p>"

COM_BBCOMMENTS_CONFIG_HEADER_OVERRIDABLE_HEADER="Kommentarstandardparameter"
COM_BBCOMMENTS_CONFIG_HEADER_OVERRIDABLE_DESC="Die folgenden Parameter können in jedem Artikel oder jeder Artikelkategorie überschrieben werden."

COM_BBCOMMENTS_COMMENTS_SHOW_LABEL="Kommentaroberfläche"
COM_BBCOMMENTS_COMMENTS_SHOW_DESC="Soll die Kommentaroberfläche angezeigt werden? Wenn Ausblenden gewählt wird, werden alle vorhandenen Kommentare ausgeblendet und neue Kommentare deaktiviert. Diese Einstellung kann in bestimmten Kategorien und / oder Artikeln überschrieben werden."

COM_BBCOMMENTS_COMMENTS_SHOW_FEATURE_LABEL="Zusammenfassung auf der Startseite (Hauptbeiträge)"
COM_BBCOMMENTS_COMMENTS_SHOW_FEATURE_DESC="Soll die Anzahl der Kommentare angezeigt werden, die für jeden Artikel (als Hauptbeitrag) auf der Startseite veröffentlicht wurden?"

COM_BBCOMMENTS_COMMENTS_SHOW_CATEGORY_LABEL="Zusammenfassung in Blog-Ansichten"
COM_BBCOMMENTS_COMMENTS_SHOW_CATEGORY_DESC="Soll die Anzahl der veröffentlichten Kommentare zu jedem Artikel in den Blog-Ansichten von Joomla angezeigt werden?"

COM_BBCOMMENTS_COMMENTS_SHOW_ARTICLE_LABEL="Zusammenfassung im Newsflash-Modul"
COM_BBCOMMENTS_COMMENTS_SHOW_ARTICLE_DESC="Soll die Anzahl der veröffentlichten Kommentare zu jedem Artikel im Joomla-Newsflash-Modul angezeigt werden?"

COM_BBCOMMENTS_OPT_COMMENTS_SHOW_BEFORE="Vor dem Inhalt"
COM_BBCOMMENTS_OPT_COMMENTS_SHOW_AFTER="Nach dem Inhalt"

COM_BBCOMMENTS_COMMENTS_ENABLED_LABEL="Neue Kommentare zulassen"
COM_BBCOMMENTS_COMMENTS_ENABLED_DESC="Sollen neue Kommentare erlaubt sein? Bei „Nein“ bleiben vorhandene Kommentare sichtbar, es können aber keine neuen Kommentare geschrieben werden. Diese Einstellung kann für Kategorien und Beiträge überschrieben werden."

COM_BBCOMMENTS_COMMENTS_REPLY_BAD_UX_LABEL="Eingabeformular für Kommentare standardmäßig ausblenden"
COM_BBCOMMENTS_COMMENTS_REPLY_BAD_UX_DESC="Soll das Eingabeformular für Kommentare standardmäßig ausgeblendet werden? In diesem Fall wird anstelle des Eingabeformulars die Schaltfläche „Kommentar hinterlassen“ angezeigt. Wenn der Benutzer auf diese Schaltfläche (oder auf die Antwortschaltfläche eines Kommentars) klickt, verschwindet die Schaltfläche „Kommentar hinterlassen“ und das Eingabeformular wird angezeigt."

COM_BBCOMMENTS_COMMENTS_PLEASEWAIT_LABEL="„Bitte warten“ beim Absenden anzeigen"
COM_BBCOMMENTS_COMMENTS_PLEASEWAIT_DESC="Wenn diese Option aktiviert ist, wird die Absenden-Schaltfläche nach dem Anklicken deaktiviert und zeigt „Bitte warten“ an. Dadurch werden versehentliche Mehrfachsendungen erschwert. Die Funktion benötigt JavaScript."

COM_BBCOMMENTS_COMMENTS_MIN_LENGTH_LABEL="Minimale Kommentarlänge"
COM_BBCOMMENTS_COMMENTS_MIN_LENGTH_DESC="Die minimal zulässige Länge (in Bytes) des HTML-Codes eines Kommentars. 0 verwenden, um keine Begrenzung anzuwenden."

COM_BBCOMMENTS_COMMENTS_MAX_LENGTH_LABEL="Maximale Kommentarlänge"
COM_BBCOMMENTS_COMMENTS_MAX_LENGTH_DESC="Die maximal zulässige Länge (in Bytes) des HTML-Codes eines Kommentars. 0 verwenden, um keine Begrenzung anzuwenden. Wenn dieser Wert ungleich Null ist, muss er größer als der in „Minimale Kommentarlänge“ sein, andernfalls wird diese Einstellung <em>ignoriert</em>."

COM_BBCOMMENTS_COMMENTS_ORDERING_LABEL="Kommentare sortieren"
COM_BBCOMMENTS_COMMENTS_ORDERING_DESC="Zeigt die Reihenfolge der Kommentare nach Datum an. Aufsteigend zeigt die ältesten Kommentare zuerst. Absteigend zeigt die neuesten Kommentare zuerst."

COM_BBCOMMENTS_COMMENTS_CLOSE_AFTER_LABEL="Kommentare nach dieser Anzahl an Tagen schließen"
COM_BBCOMMENTS_COMMENTS_CLOSE_AFTER_DESC="Kommentare werden nach Anzahl dieser Tage seit Veröffentlichung des Artikels automatisch geschlossen. 0 ist ein spezieller Wert und bedeutet, dass die Kommentare niemals automatisch geschlossen werden. Diese Einstellung kann in bestimmten Kategorien und / oder Artikeln überschrieben werden."

COM_BBCOMMENTS_COMMENTS_NOTIFY_AUTHOR_LABEL="Autor benachrichtigen"
COM_BBCOMMENTS_COMMENTS_NOTIFY_AUTHOR_DESC="Soll der Artikelautor benachrichtigt werden, sobald ein neuer Kommentar veröffentlicht wurde? Bei Kommentaren mit Moderation erfolgt die Benachrichtigung erst nach der Freigabe."

COM_BBCOMMENTS_COMMENTS_NOTIFY_USERS_LABEL="Benutzer benachrichtigen"
COM_BBCOMMENTS_COMMENTS_NOTIFY_USERS_DESC="Sollen die Benutzer benachrichtigt werden (E-Mails senden), wenn eine Antwort auf einen Kommentar gesendet wird, den sie zum Inhalt gepostet haben?"

; Configuration -- Text Filtering
COM_BBCOMMENTS_CONFIG_FILTERING_FIELDSET_LABEL="Textfilterung"
COM_BBCOMMENTS_CONFIG_FILTERING_FIELDSET_DESC="Konfiguriert die Filterung des HTML-Codes der Kommentare. <strong>WARNUNG!</strong> Das Ändern dieser Optionen wirkt sich auf die Sicherheit der Site aus. Es wird dringend empfohlen, die Standardoptionen zu verwenden, es sei denn, es ist sicher, dass die Auswirkungen auf die Sicherheit verstanden werden."

COM_BBCOMMENTS_CONFIG_FILTER_MODE_LABEL="Filtermodus"
COM_BBCOMMENTS_CONFIG_FILTER_MODE_DESC="<p>BlackBrix Comments bietet drei Modi zum Filtern des HTML-Inhalts von Kommentaren, um sie sicher zu machen:</p><ul><li><strong>Joomla Textfilterung</strong>. Hierbei werden die in der globalen Konfiguration definierten Optionen für Textfilter von Joomla unter Verwendung des eigenen HTML-Filtercodes von Joomla verwendet.</li><li><strong>HTML Bereinigung</strong>. Dies verwendet die robustere HTML Bereinigungsbibliothek. Wenn eine Benutzergruppe so eingerichtet ist, dass keine HTML-Filterung verwendet wird, wird auf Joomlas Code zurückgegriffen, der alle HTML-Tags entfernt.</li><li><strong>HTML Bereinigung (erlaubt minimales HTML)</strong>. Wie die obige Option, aber wenn eine Benutzergruppe so eingerichtet ist, dass keine HTML-Filterung verwendet wird, erlaubt dies eine <em>sehr</em> kleine Teilmenge sicherer HTML-Tags. Empfohlen, damit Gäste formatierte Kommentare veröffentlichen können, ohne die Sicherheit der Website zu gefährden.</li></ul>"
COM_BBCOMMENTS_CONFIG_FILTER_MODE_JOOMLA="Joomla Textfilterung"
COM_BBCOMMENTS_CONFIG_FILTER_MODE_HTMLPURIFIER="HTML Bereinigung"
COM_BBCOMMENTS_CONFIG_FILTER_MODE_STRICT="HTML Bereinigung (erlaubt minimales HTML)"

COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_CONFIG_JOOMLA_LABEL="HTML Bereinigung benutzt die Joomla Textfilter-Konfiguration"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_CONFIG_JOOMLA_DESC="<p>Nur anwendbar, wenn der Filtermodus auf “HTML Bereinigung (mit Joomla Fallback)“ oder “Nur HTML Bereinigung“.</p><p>Wenn aktiviert, verwendet HTML Bereinigung das Tag und die Attribute Blacklist und Whitelist, die auf der Registerkarte Textfilter von Joomla auf der Seite Globale Konfiguration definiert sind. Auf diese Weise kann pro Benutzergruppe eine andere HTML-Filterstufe festgelegt werden, die jedoch unter bestimmten Umständen unsicher sein kann.</p><p>Wenn deaktiviert, verwendet HTML Bereinigung die unten stehende Option “HTML Bereinigung Whitelist“ Option unten für <strong>alle Benutzer</strong>. Dies ist der sicherste Ansatz, verhindert jedoch, dass erweiterte Tags verwendet werden, Videos einbetten usw., selbst wenn man selbst ein Superuser ist!</p>"

COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_CONFIGSTRING_LABEL="HTML Bereinigung Whitelist"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_CONFIGSTRING_DESC="<p>Gilt nur, wenn beide a. Der Filtermodus ist auf “HTML Bereinigung (mit Joomla Fallback)“ oder “Nur HTML Bereinigung“ und b. “HTML Bereinigung benutzt Joomla Textfilter-Konfiguration“ auf Nein gesetzt ist.</p><p>Diese Option teilt der HTML Bereinigung mit, welche Tags und welche Attribute zulässig sind. Alles, was hier nicht explizit definiert ist, wird abgelehnt.</p><p>Dies ist eine durch Kommas getrennte Zeichenfolge von Elementen, die als <code>Tag</code> (Tag erlaubt, aber ohne Attribute) oder <code>Tag[attribute]</code> (Attribut für Tag zulässig). Einstellungen sind kumulativ.</p>"

; Configuration -- Advanced
COM_BBCOMMENTS_CONFIG_ADVANCED_FIELDSET_LABEL="Erweitert"
COM_BBCOMMENTS_CONFIG_ADVANCED_FIELDSET_DESC="Konfigurationsoptionen für erfahrene Benutzer"


COM_BBCOMMENTS_CONFIG_IPLOOKUP_LABEL="IP-Lookup-Service"
COM_BBCOMMENTS_CONFIG_IPLOOKUP_DESC="<p>Hier wird eine URL für einen IP-Lookup-Service eingegeben. Dies wird immer dann verwendet, wenn BlackBrix Comments IP-Adressen für Kommentaradministratoren und Inhaltseditoren anzeigt.</p><p>Verwendet wird das Format <code>https://www.beispiel.tld/irgendwas/%s</code>, z.B. Ersetzen der URL des Suchdienstes angezeigte IP durch <code>%s</code>.</p><p>Zur Vereinfachung wurde ein Standardwert angegeben. Dieser Drittanbieter-Service ist in keiner Weise mit BlackBrix verbunden oder wird von BlackBrix unterstützt.</p>"

COM_BBCOMMENTS_CONFIG_MAX_SPAM_AGE_LABEL="Spam nach einer bestimmten Anzahl von Tagen löschen"
COM_BBCOMMENTS_CONFIG_MAX_SPAM_AGE_DESC="<p>Als Spam markierte Kommentare, die älter als die angegebene Anzahl von Tagen sind, werden automatisch bereinigt. Das Content-Plugin überprüft dies höchstens alle acht Stunden, sofern es ausgeführt wird und die Website aufgerufen wird.</p><p>Mit 0 wird die automatische Bereinigung deaktiviert. Die entfernte Console-Erweiterung ist dafür nicht erforderlich.</p>"


COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_LABEL="HTML Bereinigung einbeziehen"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_DESC="<p>Hier wird ausgewählt, wie BlackBrix Comments die HTML Bereinigungs-Bibliothek einbeziehen soll. Bei Unsicherheit sollte “Composer“ gewählt werden.</p><ul><li><strong>Composer</strong> Verwendet den Composer-Autoloader. Standard und empfohlen.</li><li><strong>Autoloader</strong> Verwendet den Autoloader von HTML Bereinigung. Funktionell äquivalent zu “Composer“, jedoch wird Composer selbst nicht geladen, da es ohnehin nicht von der HTML Bereinigung verwendet wird.</li><li><strong>Alles auf einmal</strong> Dadurch werden alle HTML Bereinigungsklassen gleichzeitig in den Speicher geladen. Es bietet eine bessere Leistung, wenn die Site den OPcode-Cache von PHP verwendet.</li></ul>"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_COMPOSER="Composer"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_AUTO="Autoloader"
COM_BBCOMMENTS_CONFIG_HTMLPURIFIER_INCLUDE_ALL="Alles auf einmal"

COM_BBCOMMENTS_CONFIG_LOADCUSTOMCSS_LABEL="Benutzerdefiniertes CSS laden"
COM_BBCOMMENTS_CONFIG_LOADCUSTOMCSS_DESC="Nur für Sites verwenden, die Bootstrap 5 NICHT im Frontend-Template verwenden. Lädt eine benutzerdefinierte CSS-Datei (media/com_bbcomments/css/comments.css oder ihre Medienüberschreibung) in die Frontend-Seiten."

COM_BBCOMMENTS_CONTEXT_LABEL="Verwendung (Standard)"
COM_BBCOMMENTS_CONTEXT_DESC="Standardmäßig Artikelkommentare. Einzelne Kategorien und Artikel können diese Auswahl überschreiben."
COM_BBCOMMENTS_CONTEXT_COMMENT="Artikelkommentare"
COM_BBCOMMENTS_CONTEXT_GUESTBOOK="Gästebuch"

COM_BBCOMMENTS_GUESTBOOK_BUTTON_LABEL="Gästebuch-Button automatisch anzeigen"
COM_BBCOMMENTS_GUESTBOOK_BUTTON_DESC="Wenn aktiviert, erscheint bei Gästebuchartikeln nach dem Artikeltext automatisch eine Schaltfläche „Eintrag schreiben“ (vor der Eintragsliste). Bestehende manuell eingefügte Gästebuch-Links werden nicht verdoppelt. Standard: Nein."
