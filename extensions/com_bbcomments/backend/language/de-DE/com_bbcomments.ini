COM_BBCOMMENTS_MAIL_NOTIFY_AUTHOR_BODY="Hallo {RECIPIENT_NAME},\n\nein neuer Kommentar wurde eingereicht zu “{CONTENT_TITLE}”. Der Kommentar wurde bereits veröffentlicht.\n\nDie Kommentardetails befinden sich unten.\n\n{NAME}\n\nam {DATE_LOCAL}\n\n{COMMENT_SANITIZED}\n\nKommentar-URL: {COMMENT_LINK}\n\nSie erhalten diese E-Mail, weil Sie der Autor des Inhalts sind, der kommentiert wurde.\nWenn Sie diese E-Mails für diesen Inhalt nicht erhalten möchten, können Sie diese hier abmelden: {UNSUBSCRIBE_URL}\nDer Link zum Abbestellen betrifft nur Benachrichtigungen für den Inhalt, zu dem dieser Kommentar eingereicht wurde. Es beendet die Benachrichtigungen über Kommentare nicht, die zu anderen Inhalten eingereicht wurden, die Sie möglicherweise bereits auf unserer Website kommentiert haben. Wenn Sie einen neuen Kommentar zu diesem Inhalt senden, werden die Benachrichtigungen erneut abonniert.\n\nBitte antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
