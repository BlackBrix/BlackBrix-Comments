COM_BBCOMMENTS_TITLE_EMAILTEMPLATES="E-Mail-Vorlagen"

COM_BBCOMMENTS_EMAILTEMPLATES_LBL_WHERE_HEAD="Wo befinden sich die E-Mail-Vorlagen?"
COM_BBCOMMENTS_EMAILTEMPLATES_LBL_WHERE_TEXT="E-Mail-Vorlagen für Kern- und Drittanbieter-Erweiterungen wie BlackBrix Comments werden zentral von Joomla selbst auf der Seite System, E-Mail-Vorlagen verwaltet. Erweiterungen von Drittanbietern müssen jedoch ihren eigenen Code implementieren, um die E-Mail-Vorlagen zu installieren und zu aktualisieren. Das macht diese Seite. Wenn die E-Mail-Vorlagen angepasst werden sollen, bitte unten auf die Schaltfläche klicken, um zur Seite mit den E-Mail-Vorlagen von Joomla zu gelangen."
COM_BBCOMMENTS_EMAILTEMPLATES_BTN_MAILTEMPLATES="E-Mail-Vorlagen"

COM_BBCOMMENTS_EMAILTEMPLATES_LBL_MANAGE_HEAD="E-Mail-Vorlagen Verwaltung"
COM_BBCOMMENTS_EMAILTEMPLATES_BTN_UPDATE="Installieren oder aktualisieren"
COM_BBCOMMENTS_EMAILTEMPLATES_LBL_UPDATE="Installiert neue E-Mail-Vorlagen für BlackBrix Comments und aktualisiert vorhandene, wenn sie sich geändert haben. Die vom Benutzer modifizierten E-Mail-Vorlagen für BlackBrix Comments bleiben intakt."
COM_BBCOMMENTS_EMAILTEMPLATES_BTN_RESET="Zurücksetzen"
COM_BBCOMMENTS_EMAILTEMPLATES_LBL_RESET="Setzt die E-Mail-Vorlagen zurück. Dadurch werden alle E-Mail-Vorlagen für BlackBrix Comments entfernt, <strong>einschließlich aller vom Benutzer modifizierten E-Mail-Vorlagen</strong>. Anschließend werden alle E-Mail-Vorlagen von BlackBrix Comments neu installiert. Bitte diese Schaltfläche nur dann betätigen, wenn vermutet wird, etwas in der Datenbank beschädigt zu haben. Andernfalls den Joomla E-Mail-Vorlagen-Manager verwenden, um den Betreff und den Text jeder E-Mail mithilfe der Schaltflächen in der Benutzeroberfläche von Joomla auf die Standardeinstellungen zurückzusetzen."

COM_BBCOMMENTS_EMAILTEMPLATES_ERR_NOUPDATE="Es wurden keine E-Mail-Vorlagen überprüft."
COM_BBCOMMENTS_EMAILTEMPLATES_ERR_RESET="Es wurden keine E-Mail-Vorlagen zurückgesetzt."

COM_BBCOMMENTS_EMAILTEMPLATES_LBL_N_UPDATED_1="Eine E-Mail-Vorlage wurde überprüft."
COM_BBCOMMENTS_EMAILTEMPLATES_LBL_N_UPDATED="%d E-Mail-Vorlagen wurden überprüft."
COM_BBCOMMENTS_EMAILTEMPLATES_LBL_N_RESET_1="Eine E-Mail-Vorlage wurde zurückgesetzt."
COM_BBCOMMENTS_EMAILTEMPLATES_LBL_N_RESET="%d E-Mail-Vorlagen wurden zurückgesetzt."

