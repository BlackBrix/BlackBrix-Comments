COM_BBCOMMENTS_TITLE_EMAILTEMPLATES="E-Mail-Vorlagen"

COM_BBCOMMENTS_MAIL_MANAGE_TITLE="Moderieren: Kommentarmanager bitten, einen neuen, unveröffentlichten Kommentar zu moderieren"
COM_BBCOMMENTS_MAIL_MANAGE_SHORT="Moderieren"
COM_BBCOMMENTS_MAIL_MANAGE_DESC="Wird an Kommentarmanager gesendet, wenn ein unveröffentlichter Kommentar auf Moderation wartet."
COM_BBCOMMENTS_MAIL_MANAGE_SUBJECT="Ein neuer Kommentar zu “{CONTENT_TITLE}” erwartet Moderation"
COM_BBCOMMENTS_MAIL_MANAGE_BODY="Hallo {RECIPIENT_NAME},\n\nein neuer Kommentar wurde unter “{CONTENT_TITLE}” eingereicht. Der Kommentar ist derzeit unveröffentlicht und wartet auf Moderation.\n\nDie Kommentardetails finden Sie unten.\n\n{NAME} <{EMAIL}>\nVon {IP}, am {DATE_LOCAL}\nBenutzer-Agent: {USER_AGENT}\n\n{COMMENT_SANITIZED}\n\nKommentar-URL: {COMMENT_LINK}\n\nSie erhalten diese E-Mail, weil Sie ein Kommentarmanager für die Inhalte sind, die kommentiert wurden.\nSie können diese E-Mails nicht abbestellen, da Sie ein Kommentarmanager sind.\nBitte antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet."
COM_BBCOMMENTS_MAIL_MANAGE_BODY_HTML="<style type=\"text/css\"> :root { color-scheme: light dark; } /*Reset styles*/ body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12pt; margin: 0; padding: 0; color: black; background: slategrey; } .bbcommentsemail-outer-wrapper { background: slategrey; } .bbcommentsemail-outer-wrapper table { width: 100%; max-width: 960px; margin: 0 auto; } .bbcommentsemail-wrapper { width: 100%; height: 100%; padding: 1em; } .bbcommentsemail-container { background-color: white; color: black; text-align: left; box-shadow: black 0 0 8px; } .bbcommentsemail-sitename { background-color: #efefef; text-align: right; padding: 1em 1em; min-height: 40px; } .bbcommentsemail-sitename a { color: black; font-size: 16pt; border: none; text-decoration: none; } .bbcommentsemail-message { padding: 0.5em 1em; } .bbcommentsemail-message a { color: #38b5b8; text-decoration: underline; } .bbcommentsemail-comment-header { padding: 0.25em; background-color: darkslategray; color: white; } img.bbcommentsemail-comment-header-avatar { float: left; margin: 0 0.5em 0.5em 0; } span.bbcommentsemail-comment-name { display: block; font-weight: bold; } span.bbcommentsemail-comment-email { display: block; font-size: 90%; } span.bbcommentsemail-comment-ip, span.bbcommentsemail-comment-date, span.bbcommentsemail-comment-user-agent { font-size: 90%; color: lightgrey; } span.bbcommentsemail-comment-user-agent:before { content: \" • \"; } .bbcommentsemail-comment { margin: 0.5em 0; border-left: 3px solid grey; padding: 0 .5em; overflow: scroll; } a.bbcommentsemail-button { display: inline-block; text-align: center; padding: 0.25em 0.5em; color: cornflowerblue; box-sizing: border-box; text-decoration: none; font-size: 10pt; } a.bbcommentsemail-button:hover { color: dodgerblue; } a.bbcommentsemail-button-success { color: seagreen; } a.bbcommentsemail-button-success:hover { color: darkseagreen; } a.bbcommentsemail-button-warning { color: darkorange; } a.bbcommentsemail-button-warning:hover { color: orange; } a.bbcommentsemail-button-danger { color: red; } a.bbcommentsemail-button-danger:hover { color: darkred; } .bbcommentsemail-legalinfo { text-align: center; width: 100%; max-width: 960px; color: lightgrey; font-size: 9pt; font-weight: normal; background-color: rgba(0, 0, 0, 0.2); margin: 2em auto; padding: 0.5em 0; } .bbcommentsemail-legalinfo a { color: white; font-weight: bold; text-decoration: underline; border: none; } .bbcommentsemail-legalinfo p { margin: 0.3em 1em 0; } @media (prefers-color-scheme: dark) { body { background: darkslategray; } .bbcommentsemail-outer-wrapper { background-color: darkslategray; } .bbcommentsemail-container { background-color: #383636; color: lightgrey; } .bbcommentsemail-sitename { background-color: #1f2f2f; } .bbcommentsemail-sitename a { color: whitesmoke; } a.bbcommentsemail-button-danger:hover { color: orangered; } } </style><div class=\"bbcommentsemail-outer-wrapper\">\n<table>\n<tr>\n<td width=\"10%\"></td>\n<td>\n<div class=\"bbcommentsemail-wrapper\">\n<div class=\"bbcommentsemail-container\">\n<!-- Logo Header -->\n<div class=\"bbcommentsemail-sitename\">\n<a href=\"{SITEURL}\" title=\"Besuche {SITENAME}\">\n{SITENAME}\n</a>\n</div>\n<!-- Message -->\n<div class=\"bbcommentsemail-message\">\n<p>\nHallo {RECIPIENT_NAME},\n</p>\n<p>\nein neuer Kommentar wurde eingereicht zu “<a href=\"{CONTENT_LINK}\">{CONTENT_TITLE}</a>”. Der Kommentar ist derzeit unveröffentlicht und wartet auf Ihre Moderation.\n</p>\n<p>\nDie Kommentardetails befinden sich unten.\n</p>\n<!-- Comment -->\n<div class=\"bbcommentsemail-comment-header\">\n<img src=\"{AVATAR_URL}\" class=\"bbcommentsemail-comment-header-avatar\">\n<span class=\"bbcommentsemail-comment-name\">\n{NAME}\n</span>\n<span class=\"bbcommentsemail-comment-email\">\n{EMAIL}\n</span>\n<span class=\"bbcommentsemail-comment-ip\">\nFrom {IP}\n</span>\n<span class=\"bbcommentsemail-comment-date\">\non {DATE_LOCAL}\n</span>\n<span class=\"bbcommentsemail-comment-user-agent\">\nBenutzer-Agent: {USER_AGENT}\n</span>\n</div>\n<div class=\"bbcommentsemail-comment\">\n{COMMENT_SANITIZED}\n</div>\n<div>\n<a class=\"bbcommentsemail-button\" href=\"{COMMENT_LINK}\">\nKommentar anzeigen\n</a>\n<a class=\"bbcommentsemail-button bbcommentsemail-button-success\" href=\"{PUBLISH_URL}\">\nVeröffentlichen\n</a>\n<a class=\"bbcommentsemail-button bbcommentsemail-button-danger\" href=\"{DELETE_URL}\">\nLöschen\n</a>\n<a class=\"bbcommentsemail-button bbcommentsemail-button-warning\" href=\"{POSSIBLESPAM_URL}\">\nMöglicher Spam\n</a>\n<a class=\"bbcommentsemail-button bbcommentsemail-button-danger\" href=\"{SPAM_URL}\">\nSpam und Löschen\n</a>\n</div>\n</div>\n</div>\n\n<!-- Legal info -->\n<div class=\"bbcommentsemail-legalinfo\">\n<p>\nSie erhalten diese E-Mail, weil Sie ein Kommentarmanager für den Inhalt sind, der kommentiert wurde.\n</p>\n<p>\nSie können diese E-Mails <em>nicht</em> abbestellen, da Sie ein Kommentarmanager sind.\n</p>\n<p>\nBitte antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.\n</p>\n</div>\n</div>\n</td>\n<td width=\"10%\"></td>\n</tr>\n</table>\n</div>"

