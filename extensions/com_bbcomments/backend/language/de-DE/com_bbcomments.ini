 a.bbcommentsemail-button-warning:hover { color: orange; } a.bbcommentsemail-button-danger { color: red; } a.bbcommentsemail-button-danger:hover { color: darkred; } .bbcommentsemail-legalinfo { text-align: center; width: 100%; max-width: 960px; color: lightgrey; font-size: 9pt; font-weight: normal; background-color: rgba(0, 0, 0, 0.2); margin: 2em auto; padding: 0.5em 0; } .bbcommentsemail-legalinfo a { color: white; font-weight: bold; text-decoration: underline; border: none; } .bbcommentsemail-legalinfo p { margin: 0.3em 1em 0; } @media (prefers-color-scheme: dark) { body { background: darkslategray; } .bbcommentsemail-outer-wrapper { background-color: darkslategray; } .bbcommentsemail-container { background-color: #383636; color: lightgrey; } .bbcommentsemail-sitename { background-color: #1f2f2f; } .bbcommentsemail-sitename a { color: whitesmoke; } a.bbcommentsemail-button-danger:hover { color: orangered; } } </style><div class=\"bbcommentsemail-outer-wrapper\">\n<table>\n<tr>\n<td width=\"10%\"></td>\n<td>\n<div class=\"bbcommentsemail-wrapper\">\n<div class=\"bbcommentsemail-container\">\n<!-- Logo Header -->\n<div class=\"bbcommentsemail-sitename\">\n<a href=\"{SITEURL}\" title=\"Besuche {SITENAME}\">\n{SITENAME}\n</a>\n</div>\n<!-- Message -->\n<div class=\"bbcommentsemail-message\">\n<p>\nHallo {RECIPIENT_NAME},\n</p>\n<p>\nein neuer Kommentar wurde zu “<a href=\"{CONTENT_LINK}\">{CONTENT_TITLE}</a>” eingereicht. Der Kommentar wurde bereits veröffentlicht.\n</p>\n<p>\nDie Kommentardetails befinden sich unten.\n</p>\n<!-- Comment -->\n<div class=\"bbcommentsemail-comment-header\">\n<img src=\"{AVATAR_URL}\" class=\"bbcommentsemail-comment-header-avatar\">\n<span class=\"bbcommentsemail-comment-name\">\n{NAME}\n</span>\n<span class=\"bbcommentsemail-comment-date\">\nam {DATE_LOCAL}\n</span>\n</div>\n<div class=\"bbcommentsemail-comment\">\n{COMMENT_SANITIZED}\n</div>\n<div>\n<a class=\"bbcommentsemail-button\" href=\"{COMMENT_LINK}\">\nKommentar anzeigen\n</a>\n</div>\n</div>\n</div>\n\n<!-- Legal info -->\n<div class=\"bbcommentsemail-legalinfo\">\n<p>\nSie erhalten diese E-Mail, weil Sie der Autor des Inhalts sind, der kommentiert wurde.\n</p>\n<p>\nWenn Sie diese E-Mails für diesen Inhalt nicht erhalten möchten, können Sie diese hier <a href=\"{UNSUBSCRIBE_URL_HTML}\">abmelden</a>.\n</p>\n<p>\nDer Link zum Abbestellen betrifft nur Benachrichtigungen für den Inhalt, zu dem dieser Kommentar eingereicht wurde. Es beendet die Benachrichtigungen über Kommentare nicht, die zu anderen Inhalten eingereicht wurden, die Sie möglicherweise bereits auf unserer Website kommentiert haben. Wenn Sie einen neuen Kommentar zu diesem Inhalt senden, werden die Benachrichtigungen erneut abonniert.\n</p>\n<p>\nBitte antworten Sie nicht auf diese E-Mail, sie wird von einer nicht überwachten E-Mail-Adresse gesendet.\n</p>\n</div>\n</div>\n</td>\n<td width=\"10%\"></td>\n</tr>\n</table>\n</div>"

