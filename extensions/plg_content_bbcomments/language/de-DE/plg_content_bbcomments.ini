COM_BBCOMMENTS_COMMENTS_ARTICLE_HEADER_N_COMMENTS_0="Keine Kommentare zu “%2$s”"
COM_BBCOMMENTS_COMMENTS_ARTICLE_HEADER_N_COMMENTS_1="Ein Kommentar zu “%2$s”"
COM_BBCOMMENTS_COMMENTS_ARTICLE_HEADER_N_COMMENTS="%d Kommentare zu “%2$s”"

PLG_CONTENT_BBCOMMENTS_FORM_HEAD="Kommentare"
PLG_CONTENT_BBCOMMENTS_FORM_SUBHEAD="Konfigurieren der Artikelkommentare. Powered by BlackBrix Comments."

PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_LABEL="Kommentaroberfläche"
PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_DESC="Soll die Kommentaroberfläche angezeigt werden? Wenn Ausblenden gewählt wird, werden alle vorhandenen Kommentare ausgeblendet und neue Kommentare deaktiviert."

PLG_CONTENT_BBCOMMENTS_DEFAULT_PUBLISH_LABEL="Neue Kommentare"
PLG_CONTENT_BBCOMMENTS_DEFAULT_PUBLISH_DESC="<p>Sollen neu gepostete Kommentare standardmäßig veröffentlicht oder nicht veröffentlicht werden? Im letzteren Fall muss ein Kommentaradministrator sie manuell veröffentlichen. Die Option „Global verwenden“ (Standard) weist BlackBrix Comments an, das zu tun, was auf der Seite „Optionen“ der Komponente festgelegt wurde.</p><p><strong>WICHTIG!</strong> Diese Option gilt NICHT für Kommentare, die von Kommentaradministratoren veröffentlicht werden. Diese Kommentare werden immer sofort veröffentlicht. Es wäre unsinnig, den Nutzer, der einen solchen Kommentar postet, aufzufordern, seinen eigenen Kommentar zu moderieren.</p>"

PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_FEATURE_LABEL="Zusammenfassung auf der Startseite (Hauptbeiträge)"
PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_FEATURE_DESC="Soll die Anzahl der Kommentare angezeigt werden, die für jeden Artikel (als Hauptbeitrag) auf der Startseite veröffentlicht wurden?"

PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_CATEGORY_LABEL="Zusammenfassung in Blog-Ansichten"
PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_CATEGORY_DESC="Soll die Anzahl der veröffentlichten Kommentare zu jedem Artikel in den Blog-Ansichten von Joomla angezeigt werden?"

PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_ARTICLE_LABEL="Zusammenfassung im Newsflash-Modul"
PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_ARTICLE_DESC="Soll die Anzahl der veröffentlichten Kommentare zu jedem Artikel im Joomla-Newsflash-Modul angezeigt werden?"

PLG_CONTENT_BBCOMMENTS_OPT_COMMENTS_SHOW_BEFORE="Vor dem Inhalt"
PLG_CONTENT_BBCOMMENTS_OPT_COMMENTS_SHOW_AFTER="Nach dem Inhalt"

PLG_CONTENT_BBCOMMENTS_COMMENTS_ORDERING_LABEL="Kommentare sortieren"
PLG_CONTENT_BBCOMMENTS_COMMENTS_ORDERING_DESC="Zeigt die Reihenfolge der Kommentare nach Datum an. Aufsteigend zeigt die ältesten Kommentare zuerst. Absteigend zeigt die neuesten Kommentare zuerst."

PLG_CONTENT_BBCOMMENTS_COMMENTS_ENABLED_LABEL="Neue Kommentare zulassen"
PLG_CONTENT_BBCOMMENTS_COMMENTS_ENABLED_DESC="Sollen neue Kommentare erlaubt sein? Bei „Nein“ bleiben vorhandene Kommentare sichtbar, aber neue Eingaben sind nicht möglich."

PLG_CONTENT_BBCOMMENTS_COMMENTS_CLOSE_AFTER_LABEL="Kommentare nach Anzahl der angegebenen Tage schließen"
PLG_CONTENT_BBCOMMENTS_COMMENTS_CLOSE_AFTER_DESC="Kommentare werden nach der angegebenen Anzahl der Tagen seit Veröffentlichung des Artikels automatisch geschlossen. 0 ist ein spezieller Wert und bedeutet, dass die Kommentare niemals automatisch geschlossen werden."

PLG_CONTENT_BBCOMMENTS_COMMENTS_NOTIFY_AUTHOR_LABEL="Autor benachrichtigen"
PLG_CONTENT_BBCOMMENTS_COMMENTS_NOTIFY_AUTHOR_DESC="Soll der Artikelautor benachrichtigt werden, sobald ein neuer Kommentar veröffentlicht wurde? Bei Kommentaren mit Moderation erfolgt die Benachrichtigung erst nach der Freigabe."

PLG_CONTENT_BBCOMMENTS_COMMENTS_NOTIFY_USERS_LABEL="Benutzer benachrichtigen"
PLG_CONTENT_BBCOMMENTS_COMMENTS_NOTIFY_USERS_DESC="Sollen die Benutzer benachrichtigt werden (E-Mails senden), wenn eine Antwort auf einen Kommentar gesendet wird, den diese zum Inhalt gepostet haben?"

PLG_CONTENT_BBCOMMENTS_CONTEXT_LABEL="Verwendung"
PLG_CONTENT_BBCOMMENTS_CONTEXT_DESC="Standardmäßig gelten Artikelkommentare. Wählen Sie Gästebuch für einen Gästebuchartikel. Die globale Einstellung wird von der Komponente, gegebenenfalls über die Kategorie, geerbt."
PLG_CONTENT_BBCOMMENTS_CONTEXT_COMMENT="Artikelkommentare"
PLG_CONTENT_BBCOMMENTS_CONTEXT_GUESTBOOK="Gästebuch"

PLG_CONTENT_BBCOMMENTS_GUESTBOOK_BUTTON_LABEL="Gästebuch-Button"
PLG_CONTENT_BBCOMMENTS_GUESTBOOK_BUTTON_DESC="Zeigt bei Verwendung „Gästebuch“ automatisch einen Button am Ende des Artikeltextes, vor der Eintragsliste. Bei „Globale Einstellung“ gilt die übergeordnete Kategorie-/Komponentenoption."
