PLG_CONTENT_BBCOMMENTS_FORM_HEAD="Comments"
PLG_CONTENT_BBCOMMENTS_FORM_SUBHEAD="Configure the article comments. Powered by BlackBrix Comments."

PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_LABEL="Comments interface"
PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_DESC="Should I display the comments interface? Choosing Hide will hide all existing comments and disable new comments."

PLG_CONTENT_BBCOMMENTS_DEFAULT_PUBLISH_LABEL="New comments"
PLG_CONTENT_BBCOMMENTS_DEFAULT_PUBLISH_DESC="<p>Should newly posted comments be published or unpublished by default? In the latter case a comment administrator needs to manually publish them. The “Use Global” option (default) tells BlackBrix Comments to do whatever you specified in the component's Options page.</p><p><strong>IMPORTANT!</strong> This option does NOT apply to comments published by comment administrators. These comments are always published immediately. It would be nonsensical asking the user posting such a comment to moderate their own comment.</p>"

PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_FEATURE_LABEL="Comment summary on Featured Articles"
PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_FEATURE_DESC="Show the number of published comments for each article in Joomla’s Featured Articles view (commonly used on the home page)?"

PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_CATEGORY_LABEL="Comment summary in Blog views"
PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_CATEGORY_DESC="Show the number of published comments for each article in Joomla’s Blog views?"

PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_ARTICLE_LABEL="Comment summary in the Newsflash module"
PLG_CONTENT_BBCOMMENTS_COMMENTS_SHOW_ARTICLE_DESC="Show the number of published comments for each article displayed by Joomla’s Newsflash module?"

PLG_CONTENT_BBCOMMENTS_OPT_COMMENTS_SHOW_BEFORE="Before content"
PLG_CONTENT_BBCOMMENTS_OPT_COMMENTS_SHOW_AFTER="After content"

PLG_CONTENT_BBCOMMENTS_COMMENTS_ORDERING_LABEL="Comments ordering"
PLG_CONTENT_BBCOMMENTS_COMMENTS_ORDERING_DESC="Display order of the comments, by date. Ascending shows oldest comments first. Descending shows newest comments first."

PLG_CONTENT_BBCOMMENTS_COMMENTS_ENABLED_LABEL="Allow new comments"
PLG_CONTENT_BBCOMMENTS_COMMENTS_ENABLED_DESC="Allow new comments? Choosing No keeps existing comments visible but prevents new submissions."

PLG_CONTENT_BBCOMMENTS_COMMENTS_CLOSE_AFTER_LABEL="Close comments after this many days"
PLG_CONTENT_BBCOMMENTS_COMMENTS_CLOSE_AFTER_DESC="Comments will be closed automatically after this many days since the article was published. 0 is a special value and it means that the comments will never be closed automatically."

PLG_CONTENT_BBCOMMENTS_COMMENTS_NOTIFY_AUTHOR_LABEL="Notify author"
PLG_CONTENT_BBCOMMENTS_COMMENTS_NOTIFY_AUTHOR_DESC="Notify the article author once a new comment becomes published. Comments requiring moderation trigger this notification only after approval."

PLG_CONTENT_BBCOMMENTS_COMMENTS_NOTIFY_USERS_LABEL="Notify users"
PLG_CONTENT_BBCOMMENTS_COMMENTS_NOTIFY_USERS_DESC="Should I notify (send emails) to the users when a reply is sent to a comment they posted on the content?"
PLG_CONTENT_BBCOMMENTS_CONTEXT_LABEL="Use as"
PLG_CONTENT_BBCOMMENTS_CONTEXT_DESC="Article comments are the default. Select Guestbook for a guestbook article. The global setting is inherited from the component, possibly through the category."
PLG_CONTENT_BBCOMMENTS_CONTEXT_COMMENT="Article comments"
PLG_CONTENT_BBCOMMENTS_CONTEXT_GUESTBOOK="Guestbook"

PLG_CONTENT_BBCOMMENTS_GUESTBOOK_BUTTON_LABEL="Guestbook button"
PLG_CONTENT_BBCOMMENTS_GUESTBOOK_BUTTON_DESC="For Guestbook usage, automatically adds a button after the article text, before the entries. Use Global inherits the parent category or component setting."
